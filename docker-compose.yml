services:
  twitch-drops-miner:
    image: ghcr.io/dermute/twitchdropsminer-web:latest
    container_name: twitch-drops-miner
    restart: unless-stopped
    ports:
      # Certificate-free Selkies HTTP fallback.
      - "3000:3000"
      # Selkies HTTPS web interface.
      - "3001:3001"
    shm_size: "1gb"
    volumes:
      - ./config:/config
    environment:
      # Owner of the files in /config.
      - PUID=1000
      - PGID=1000
      # Timezone, used for the timestamps shown by the miner.
      - TZ=Europe/Berlin
      # Optional HTTP Basic authentication. Recommended on trusted networks;
      # use a secure reverse proxy or VPN for access over the internet.
      # - CUSTOM_USER=admin
      # - PASSWORD=changeme
      # Optional fixed virtual screen size. Selkies otherwise follows the
      # browser's viewport.
      # - SELKIES_MANUAL_WIDTH=1280
      # - SELKIES_MANUAL_HEIGHT=768
