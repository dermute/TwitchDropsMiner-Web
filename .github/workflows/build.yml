name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  schedule:
    # Rebuild weekly.  This is what picks up new upstream miner builds and base
    # image updates, since the image carries the miner.
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Upstream release the image follows.
  TDM_RELEASE_TAG: dev-build

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck --shell=sh

      - name: Resolve the current upstream build
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/DevilXD/TwitchDropsMiner/releases/tags/${TDM_RELEASE_TAG}")"
          build_id="$(
            printf '%s' "${release}" \
              | jq -r '[.assets[]
                        | select(.name | startswith("Twitch.Drops.Miner.Linux.PyInstaller"))
                        | "\(.id):\(.updated_at)"]
                       | sort | join(",")'
          )"
          uploaded="$(
            printf '%s' "${release}" \
              | jq -r '[.assets[]
                        | select(.name | startswith("Twitch.Drops.Miner.Linux.PyInstaller"))
                        | .updated_at]
                       | (sort | last)[0:10]'
          )"
          echo "Upstream build: ${build_id}"
          echo "build_id=${build_id}" >> "${GITHUB_OUTPUT}"
          echo "version=${TDM_RELEASE_TAG} (${uploaded})" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_IMAGE_VERSION=${{ steps.meta.outputs.version }}
            TDM_RELEASE_TAG=${{ env.TDM_RELEASE_TAG }}
            TDM_BUILD_ID=${{ steps.upstream.outputs.build_id }}
            TDM_VERSION=${{ steps.upstream.outputs.version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
